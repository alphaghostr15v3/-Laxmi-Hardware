<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <circle cx="400" cy="260" r="280" fill="url(#glow)"/>
  
  <!-- Grid lines -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
  </g>

  <!-- Hardware Icon Silhouette Box -->
  <g transform="translate(400, 240)">
    <rect x="-100" y="-100" width="200" height="200" rx="24" fill="#0B1329" stroke="url(#accentGrad)" stroke-width="2.5" opacity="0.9"/>
    
  </g>

  <!-- Badge -->
  <rect x="250" y="405" width="300" height="34" rx="17" fill="url(#accentGrad)" opacity="0.15"/>
  <text x="400" y="428" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#D97706" text-anchor="middle" letter-spacing="2">LAXMI HARDWARE SPECIFICATION</text>

  <!-- Title & Subtitle -->
  <text x="400" y="480" font-family="'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" fill="#F8FAFC" text-anchor="middle">Walk-In Master Wardrobe</text>
  <text x="400" y="520" font-family="'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" fill="#94A3B8" text-anchor="middle">Ebco sliding wardrobe systems & hydraulic lifts</text>
</svg>